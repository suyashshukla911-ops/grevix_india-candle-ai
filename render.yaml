services:
  - type: web
    name: india-candle-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: India Candle AI
      - key: APP_BASE_URL
        sync: false
      - key: UPSTOX_CLIENT_ID
        sync: false
      - key: UPSTOX_CLIENT_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: NEWS_PROVIDER
        value: gdelt
      - key: DEFAULT_INTERVAL
        value: "5"
      - key: TRAIN_CALENDAR_DAYS
        value: "30"
      - key: MIN_TRAIN_ROWS
        value: "500"
